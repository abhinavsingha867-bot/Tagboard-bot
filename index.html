<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HEY TAGBOARD | JARVIS</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle, #102c48, #030914 75%);
    color: #00eaff;
    font-family: Arial, sans-serif;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 92%;
    max-width: 450px;
    padding: 25px;
}

h1 {
    letter-spacing: 5px;
    font-size: 27px;
    text-shadow: 0 0 15px #00eaff;
}

.subtitle {
    color: #8baeba;
    letter-spacing: 3px;
    font-size: 11px;
}

.circle {
    width: 210px;
    height: 210px;
    border: 3px solid #00eaff;
    border-radius: 50%;
    margin: 45px auto 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 20px #00eaff,
                inset 0 0 25px #00eaff;
    transition: 0.3s;
}

.circle.active {
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0%, 100% {
        box-shadow: 0 0 15px #00eaff,
                    inset 0 0 15px #00eaff;
    }

    50% {
        box-shadow: 0 0 45px #00eaff,
                    inset 0 0 40px #00eaff;
    }
}

.core {
    font-size: 35px;
    font-weight: bold;
    letter-spacing: 4px;
}

#status {
    color: white;
    font-size: 17px;
    min-height: 25px;
}

#heard {
    color: #8baeba;
    min-height: 40px;
    margin-top: 15px;
    overflow-wrap: anywhere;
}

button {
    width: 85%;
    padding: 15px;
    margin: 10px;
    border: 1px solid #00eaff;
    border-radius: 30px;
    background: transparent;
    color: #00eaff;
    font-size: 15px;
    font-weight: bold;
}

button:active {
    background: #00eaff;
    color: #030914;
}

.footer {
    margin-top: 35px;
    color: #547786;
    font-size: 10px;
    letter-spacing: 2px;
}

</style>
</head>

<body>

<div class="container">

    <h1>HEY TAGBOARD</h1>

    <div class="subtitle">
        PERSONAL AI ASSISTANT
    </div>

    <div class="circle" id="circle">
        <div class="core">T</div>
    </div>

    <div id="status">SYSTEM STANDBY</div>

    <div id="heard">
        Waiting for activation...
    </div>

    <button onclick="startListening()">
        START LISTENING
    </button>

    <button onclick="stopListening()">
        STOP SYSTEM
    </button>

    <div class="footer">
        TAGBOARD AI SYSTEM • VERSION 2.0
    </div>

</div>

<script>

// SPEECH RECOGNITION SUPPORT

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


// VARIABLES

let recognition = null;

let shouldListen = false;
let listening = false;
let activated = false;

let restartTimer = null;
let recentFinal = "";

const status = document.getElementById("status");
const heard = document.getElementById("heard");
const circle = document.getElementById("circle");


// STATUS FUNCTION

function setStatus(message) {
    status.innerText = message;
}


// NORMALIZE RECOGNIZED WORDS

function normalize(text) {

    return text
        .toLowerCase()
        .replace(/[^a-z0-9 ]/g, " ")
        .replace(/\s+/g, " ")
        .trim();

}


// SPEECH OUTPUT

function speak(message) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(message);

    speech.lang = "en-IN";
    speech.rate = 0.95;

    speechSynthesis.speak(speech);

}


// PROCESS FINAL SPEECH

function processSpeech(text) {

    const normalized = normalize(text);

    if (!normalized) {
        return;
    }

    recentFinal = (recentFinal + " " + normalized)
        .trim()
        .slice(-120);

    // WAKE WORD DETECTION

    if (!activated) {

        const wakeWordHeard =
            /\btag\s*board\b/.test(recentFinal) ||
            /\btagboard\b/.test(recentFinal);

        if (wakeWordHeard) {

            activated = true;

            recentFinal = "";

            setStatus("YES, I'M LISTENING");

            speak("Yes, I am listening");

        }

        return;
    }

    // INITIATE ACTIVE MODE

    if (/\binitiate active mode\b/.test(normalized)) {

        setStatus("ACTIVE MODE REQUESTED");

        speak("Active mode requested");

        activated = false;
        recentFinal = "";

    }

    // TERMINATE ACTIVE MODE

    else if (/\bterminate active mode\b/.test(normalized)) {

        setStatus("ACTIVE MODE STOP REQUESTED");

        speak("Active mode stop requested");

        activated = false;
        recentFinal = "";

    }

}


// START LISTENING

function startListening() {

    if (!SpeechRecognition) {

        setStatus("VOICE RECOGNITION NOT SUPPORTED");

        return;
    }

    if (shouldListen) {
        return;
    }

    shouldListen = true;
    activated = false;
    recentFinal = "";

    clearTimeout(restartTimer);

    recognition = new SpeechRecognition();

    recognition.lang = "en-IN";

    recognition.continuous = true;

    // SHOW WORDS WHILE SPEAKING
    recognition.interimResults = true;

    recognition.maxAlternatives = 1;


    // WHEN LISTENING STARTS

    recognition.onstart = () => {

        listening = true;

        circle.classList.add("active");

        setStatus("LISTENING FOR HEY TAGBOARD");

    };


    // WHEN SPEECH IS DETECTED

    recognition.onresult = (event) => {

        let displayText = "";

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            const transcript =
                event.results[i][0].transcript;

            displayText += transcript + " ";

            // PROCESS ONLY COMPLETED SPEECH

            if (event.results[i].isFinal) {

                processSpeech(transcript);

            }

        }

        // DISPLAY RECOGNIZED WORDS

        if (displayText.trim()) {

            heard.innerText =
                "HEARD: " + displayText.trim();

        }

    };


    // ERROR HANDLING

    recognition.onerror = (event) => {

        setStatus("VOICE ERROR: " + event.error);

        if (
            event.error === "not-allowed" ||
            event.error === "service-not-allowed"
        ) {

            shouldListen = false;

            listening = false;

            circle.classList.remove("active");

        }

    };


    // AUTOMATIC RESTART

    recognition.onend = () => {

        listening = false;

        if (!shouldListen) {
            return;
        }

        setStatus("RECONNECTING MICROPHONE...");

        restartTimer = setTimeout(() => {

            if (shouldListen && !listening) {

                try {

                    recognition.start();

                }

                catch (error) {

                    setStatus("RESTARTING VOICE SYSTEM...");

                }

            }

        }, 1000);

    };


    // START MICROPHONE

    try {

        recognition.start();

    }

    catch (error) {

        shouldListen = false;

        setStatus("COULD NOT START MICROPHONE");

    }

}


// STOP LISTENING

function stopListening() {

    shouldListen = false;

    listening = false;

    activated = false;

    recentFinal = "";

    clearTimeout(restartTimer);

    if (recognition) {

        recognition.stop();

    }

    circle.classList.remove("active");

    setStatus("SYSTEM STOPPED");

    heard.innerText = "Microphone inactive";

}


// END OF PROGRAM

</script>

</body>
</html>
